name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifests against the schema
        run: |
          pip install check-jsonschema==0.29.4
          check-jsonschema --schemafile schema/manifest.schema.json ports/*/*/manifest.json
      - name: Check ports and INDEX.json
        run: python3 tools/build_index.py --check
